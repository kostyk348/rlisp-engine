<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RLISP ENGINE — редактор</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f27; --panel2: #232733; --line: #2f3442;
    --txt: #c9d1e0; --dim: #7d8699; --acc: #38c7d8; --acc2: #f5a623;
    --ok: #59d98c; --err: #ef5964; --sel: #2b3a4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--txt);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  code, pre, textarea, input, .mono { font-family: "Cascadia Code", Consolas, "JetBrains Mono", monospace; }

  /* ─── тулбар ─── */
  #bar {
    display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  #logo { font-weight: 700; letter-spacing: 1.5px; color: var(--acc); }
  #logo b { color: var(--acc2); }
  .stat { color: var(--dim); font-size: 12px; }
  .stat b { color: var(--txt); font-weight: 600; }
  .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 12px;
  }
  button:hover { border-color: var(--acc); color: var(--acc); }
  button.warn:hover { border-color: var(--acc2); color: var(--acc2); }
  button.primary { background: #10333a; border-color: #1e5c66; }
  button.tog { color: var(--dim); }
  button.tog.on { color: var(--acc); border-color: #1e5c66; background: #10333a; }
  #paused-tag {
    display: none; color: var(--acc2); border: 1px solid var(--acc2);
    border-radius: 3px; padding: 1px 8px; font-size: 11px; font-weight: 700;
  }

  /* ─── сетка ─── */
  #main { flex: 1; display: grid; grid-template-columns: 230px 1fr 330px; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }
  .panel-title {
    padding: 6px 10px; font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px;
    color: var(--dim); background: var(--panel); border-bottom: 1px solid var(--line);
    text-transform: uppercase; flex: 0 0 auto;
  }
  .panel-title .hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--dim); }
  .panel-body { flex: 1; overflow-y: auto; min-height: 0; }

  /* ─── иерархия ─── */
  .grp { padding: 4px 10px; color: var(--dim); font-size: 11px; background: #171a21;
         border-bottom: 1px solid #22262f; text-transform: uppercase; letter-spacing: 1px; }
  .ent { display: flex; justify-content: space-between; padding: 4px 10px; cursor: pointer;
         border-bottom: 1px solid #1e222b; font-size: 12.5px; }
  .ent:hover { background: #20242f; }
  .ent.sel { background: var(--sel); box-shadow: inset 2px 0 0 var(--acc); }
  .ent .co { color: var(--dim); font-size: 11px; font-family: Consolas, monospace; }

  /* ─── префабы ─── */
  #prefabs { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
  .prefab {
    background: var(--panel2); border: 1px dashed var(--line); border-radius: 5px;
    padding: 7px 10px; cursor: grab; user-select: none; font-size: 12.5px;
  }
  .prefab:hover { border-color: var(--acc); color: var(--acc); }
  .prefab:active { cursor: grabbing; }
  .prefab small { color: var(--dim); display: block; font-size: 10.5px; }
  .prefab .chip { float: right; color: var(--acc2); font-size: 10.5px; font-family: Consolas, monospace; }

  /* ─── видовой порт ─── */
  #col-view { border-right: 1px solid var(--line); }
  #viewport {
    flex: 1.2; min-height: 120px; background: #0b0d12; position: relative;
    display: flex; align-items: center; justify-content: center; padding: 8px;
    border-bottom: 1px solid var(--line);
  }
  #viewport.dragover { outline: 2px dashed var(--acc); outline-offset: -6px; }
  #viewbox { position: relative; max-width: 100%; max-height: 100%; }
  #view { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated;
          border: 1px solid var(--line); }
  #gizmo { position: absolute; left: 0; top: 0; cursor: crosshair; }
  #toast {
    position: absolute; top: 14px; right: 14px; max-width: 320px;
    background: #10333aee; border: 1px solid var(--acc); color: var(--txt);
    border-radius: 5px; padding: 8px 12px; font-size: 12.5px; display: none;
  }
  #toast.warn { border-color: var(--acc2); background: #3a2c10ee; }
  #toast.err { border-color: var(--err); background: #3a1417ee; }

  /* ─── табы: код / консоль ─── */
  #tabs { display: flex; gap: 0; background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .tab { border: 0; border-radius: 0; background: transparent; color: var(--dim);
         padding: 7px 18px; font-size: 12px; }
  .tab.on { color: var(--acc); box-shadow: inset 0 -2px 0 var(--acc); }
  .tabpage { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .tabpage.on { display: flex; }
  #p-code { flex: 1.2; }
  #codebar { display: flex; align-items: center; gap: 8px; padding: 4px 10px;
             background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #codefile { color: var(--dim); font-size: 11.5px; font-family: Consolas, monospace; flex: 1; }
  #code { flex: 1; width: 100%; background: #10131a; color: var(--txt); border: 0;
          resize: none; outline: none; padding: 10px 12px; font-size: 12.5px; line-height: 1.5; }
  #assets { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; flex: 0 0 auto; }
  #assets button { font-size: 11.5px; padding: 4px 9px; }

  /* ─── консоль ─── */
  #p-console { flex: 1.2; }
  #log { flex: 1; overflow-y: auto; padding: 8px 10px; font-family: Consolas, monospace;
         font-size: 12px; background: #10131a; }
  #log .ln { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
  #log .sys { color: var(--dim); }
  #log .res { color: var(--ok); }
  #log .bad { color: var(--err); }
  #log .usr { color: var(--acc); }
  #repl { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
          border-top: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; }
  #repl .pr { color: var(--acc2); font-weight: 700; }
  #repl input { flex: 1; background: #10131a; border: 1px solid var(--line); color: var(--txt);
                border-radius: 4px; padding: 5px 9px; font-size: 12.5px; outline: none; }
  #repl input:focus { border-color: var(--acc); }

  /* ─── инспектор ─── */
  #insp { padding: 10px; }
  #insp .name { font-weight: 700; font-size: 14px; margin-bottom: 2px; color: var(--acc); }
  #insp .hint { color: var(--dim); font-size: 11.5px; }
  #insp .prop { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  #insp .prop label { flex: 0 0 84px; color: var(--dim); font-size: 12px;
                      font-family: Consolas, monospace; }
  #insp .prop input { flex: 1; background: #10131a; border: 1px solid var(--line);
                      color: var(--txt); border-radius: 4px; padding: 4px 8px; font-size: 12.5px;
                      font-family: Consolas, monospace; outline: none; }
  #insp .prop input:focus { border-color: var(--acc); }
  #insp .apply { margin-top: 10px; width: 100%; }
  #insp .del { margin-top: 6px; width: 100%; }
  .kbd { color: var(--dim); font-size: 10.5px; border: 1px solid var(--line); border-radius: 3px;
         padding: 0 5px; font-family: Consolas, monospace; }
</style>
</head>
<body>
<div id="bar">
  <span id="logo">RLISP <b>EDITOR</b></span>
  <span class="stat">кадр <b id="s-frame">0</b></span>
  <span class="stat">fps <b id="s-fps">0</b></span>
  <span class="stat">draw <b id="s-dc">0</b></span>
  <span id="paused-tag">ПАУЗА</span>
  <span class="spacer"></span>
  <button id="b-gizmo" class="tog on" title="G — показать/скрыть гизмо">⬌ Гизмо</button>
  <button id="b-snap" class="tog" title="привязка к сетке 0.5">Сетка 0.5</button>
  <button id="b-save-scene" class="warn" title="сериализовать сцену в assets/lisp/scene_saved.lisp">Сохранить сцену</button>
  <button id="b-pause">⏸ Пауза</button>
  <button id="b-step" title="один кадр в паузе">Шаг</button>
  <button id="b-reload" class="warn" title="перечитать Lisp-файлы">Reload</button>
</div>

<div id="main">
  <div class="col">
    <div class="panel-title">Иерархия</div>
    <div class="panel-body" id="hier"></div>
    <div class="panel-title">Префабы <span class="hint">— перетащи на вид</span></div>
    <div class="panel-body" id="prefabs"></div>
  </div>

  <div class="col" id="col-view">
    <div id="viewport">
      <div id="viewbox">
        <img id="view" alt="кадр движка">
        <canvas id="gizmo"></canvas>
      </div>
      <div id="toast"></div>
    </div>
    <div id="tabs">
      <button class="tab on" data-t="code">Код</button>
      <button class="tab" data-t="console">Консоль</button>
      <span class="spacer"></span>
      <span style="padding:7px 12px;color:var(--dim);font-size:11px">
        <span class="kbd">G</span> гизмо · <span class="kbd">Del</span> удалить · <span class="kbd">Ctrl+S</span> сохранить файл
      </span>
    </div>
    <div class="tabpage on" id="p-code">
      <div id="codebar">
        <span id="codefile">выбери файл в «Ассетах»…</span>
        <button id="b-save" title="Ctrl+S — сохранить, движок подхватит на лету">Сохранить</button>
      </div>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="panel-title">Ассеты</div>
      <div id="assets"></div>
    </div>
    <div class="tabpage" id="p-console">
      <div id="log"></div>
      <div id="repl">
        <span class="pr">›</span>
        <input id="repl-in" placeholder="(mcp-spawn-at 'brute 10 10) · (editor-scene) · Enter — исполнить">
      </div>
    </div>
  </div>

  <div class="col">
    <div class="panel-title">Инспектор</div>
    <div class="panel-body" id="insp"></div>
  </div>
</div>

<script>
"use strict";
/* ───────────────────────── базовые утилиты ───────────────────────── */
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
function fmt(v) { return typeof v === "number" ? (Math.round(v * 10) / 10) : v; }

let scene = [], selected = null, assets = [], curFile = null;
let lastResult = 0, lastLogSeq = 0;
let cam = null, mvp = null, prefabs = [];
let gizmoOn = true, snapOn = false;
const GIZMO_Y = 1.3; // визуальная высота гизмо (враги/игрок рисуются на y≈1.3)

async function api(path, body) {
  const opt = body ? {method: "POST", body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}
function evalLisp(code) {
  return api("/api/eval", {code: code});
}
function logLine(text, cls) {
  const d = document.createElement("div");
  d.className = "ln " + (cls || "sys");
  d.textContent = text;
  const box = $("log");
  box.appendChild(d);
  while (box.children.length > 300) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
let toastTimer = null;
function toast(text, cls) {
  const t = $("toast");
  t.textContent = text;
  t.className = cls || "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 4000);
}

/* ───────────────────────── математика: та же проекция, что в render3d.lisp ───────────────────────── */
function v3sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function v3dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function v3cross(a, b) {
  return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
}
function v3norm(a) {
  const l = Math.max(1e-9, Math.hypot(a[0], a[1], a[2]));
  return [a[0]/l, a[1]/l, a[2]/l];
}
// строка-мажорные 4x4, column-vector — как mat-perspective/mat-lookat в render3d.lisp
function m4mul(A, B) {
  const O = new Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += A[i*4+k] * B[k*4+j];
    O[i*4+j] = s;
  }
  return O;
}
function m4v(M, v) {
  return [
    M[0]*v[0] + M[1]*v[1] + M[2]*v[2] + M[3]*v[3],
    M[4]*v[0] + M[5]*v[1] + M[6]*v[2] + M[7]*v[3],
    M[8]*v[0] + M[9]*v[1] + M[10]*v[2] + M[11]*v[3],
    M[12]*v[0] + M[13]*v[1] + M[14]*v[2] + M[15]*v[3]
  ];
}
function perspMat(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2);
  return [f/aspect,0,0,0,  0,f,0,0,
          0,0,(far+near)/(near-far), 2*far*near/(near-far),
          0,0,-1,0];
}
function lookatMat(eye, target, up) {
  const f = v3norm(v3sub(target, eye));
  const r = v3norm(v3cross(f, up));
  const u = v3cross(r, f);
  return [r[0],r[1],r[2],-v3dot(r,eye),
          u[0],u[1],u[2],-v3dot(u,eye),
          -f[0],-f[1],-f[2],v3dot(f,eye),
          0,0,0,1];
}
function rebuildMvp() { mvp = cam && cam.eye ? m4mul(perspMat(cam.fov, cam.w/cam.h, 0.5, 400),
                                                    lookatMat(cam.eye, cam.target, [0,1,0])) : null; }
function entPos(e) {
  const y = e.y !== undefined ? e.y : GIZMO_Y;
  return [e.x || 0, y, e.z || 0];
}
function worldToScreen(p) {
  const box = $("view");
  const cw = box.clientWidth, ch = box.clientHeight;
  if (!mvp || !cw || !ch) return null;
  const c = m4v(mvp, [p[0], p[1], p[2], 1]);
  if (c[3] <= 0.001) return null;
  return { x: (c[0]/c[3] + 1) / 2 * cw, y: (1 - (c[1]/c[3] + 1) / 2) * ch };
}
// пиксель → луч в мире (обратная развёртка той же камеры)
function pixelRay(mx, my) {
  const box = $("view");
  const cw = box.clientWidth, ch = box.clientHeight;
  if (!cam || !cam.eye || !cw || !ch) return null;
  const ndcx = mx / cw * 2 - 1, ndcy = 1 - my / ch * 2;
  const f = v3norm(v3sub(cam.target, cam.eye));
  const r = v3norm(v3cross(f, [0, 1, 0]));
  const u = v3cross(r, f);
  const t = Math.tan(cam.fov / 2);
  const dcx = ndcx * t * (cam.w / cam.h), dcy = ndcy * t;
  return v3norm([r[0]*dcx + u[0]*dcy + f[0],
                 r[1]*dcx + u[1]*dcy + f[1],
                 r[2]*dcx + u[2]*dcy + f[2]]);
}
function rayPlaneY(dir, h) {
  if (!cam || Math.abs(dir[1]) < 1e-6) return null;
  const t = (h - cam.eye[1]) / dir[1];
  if (t <= 0) return null;
  return [cam.eye[0] + dir[0]*t, h, cam.eye[2] + dir[2]*t];
}
function snap(v) { return snapOn ? Math.round(v * 2) / 2 : Math.round(v * 100) / 100; }

/* ───────────────────────── гизмо: оси X/Y/Z над выбранной сущностью ───────────────────────── */
const AXIS = { x: [1,0,0], y: [0,1,0], z: [0,0,1] };
const AXIS_COLOR = { x: "#ef5964", y: "#59d98c", z: "#38c7d8" };
let handles = null;      // проекции концов осей для hit-теста
let drag = null;         // {axis, x0, z0, y0, ref, lastSend}

function gizmoBox() {
  const img = $("view"), cvs = $("gizmo");
  if (img.clientWidth && (cvs.width !== img.clientWidth || cvs.height !== img.clientHeight)) {
    cvs.width = img.clientWidth;
    cvs.height = img.clientHeight;
    cvs.style.width = img.clientWidth + "px";
    cvs.style.height = img.clientHeight + "px";
  }
  return { cw: cvs.width, ch: cvs.height };
}
function drawGizmo() {
  const cvs = $("gizmo"), box = gizmoBox();
  const ctx = cvs.getContext("2d");
  ctx.clearRect(0, 0, box.cw, box.ch);
  handles = null;
  if (!gizmoOn || !selected || !mvp) return;
  const pos = entPos(selected);
  const c0 = worldToScreen(pos);
  if (!c0) return;
  handles = { center: c0, axes: {} };
  ctx.lineWidth = 2;
  ctx.font = "bold 11px Consolas, monospace";
  // кольцо выбора
  ctx.strokeStyle = "rgba(245,166,35,0.9)";
  ctx.beginPath();
  ctx.arc(c0.x, c0.y, 9, 0, Math.PI * 2);
  ctx.stroke();
  for (const ax of ["x", "y", "z"]) {
    const tip = worldToScreen([pos[0] + AXIS[ax][0], pos[1] + AXIS[ax][1], pos[2] + AXIS[ax][2]]);
    if (!tip) continue;
    handles.axes[ax] = tip;
    ctx.strokeStyle = AXIS_COLOR[ax];
    ctx.fillStyle = AXIS_COLOR[ax];
    ctx.beginPath();
    ctx.moveTo(c0.x, c0.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    // стрелка
    const ang = Math.atan2(tip.y - c0.y, tip.x - c0.x);
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x - 9 * Math.cos(ang - 0.4), tip.y - 9 * Math.sin(ang - 0.4));
    ctx.lineTo(tip.x - 9 * Math.cos(ang + 0.4), tip.y - 9 * Math.sin(ang + 0.4));
    ctx.closePath();
    ctx.fill();
    ctx.fillText(ax.toUpperCase(), tip.x + 4 * Math.cos(ang), tip.y + 4 * Math.sin(ang) - 6);
  }
  // центральный квадрат — свободное перемещение по плоскости XZ
  ctx.fillStyle = "rgba(245,166,35,0.85)";
  ctx.fillRect(c0.x - 4, c0.y - 4, 8, 8);
}
function hitHandle(mx, my) {
  if (!handles) return null;
  for (const ax of ["x", "y", "z"]) {
    const h = handles.axes[ax];
    if (h && Math.hypot(h.x - mx, h.y - my) <= 12) return ax;
  }
  const c = handles.center;
  if (c && Math.abs(c.x - mx) <= 6 && Math.abs(c.y - my) <= 6) return "xz";
  return null;
}
// мировое смещение вдоль оси по движению мыши в экранных координатах
// (используется только для отладки; тяга считает от якоря — axisDragDelta)
function axisWorldDelta(axis, pos, mx, my) {
  const a = AXIS[axis];
  const p0 = worldToScreen(pos);
  const p1 = worldToScreen([pos[0] + a[0], pos[1] + a[1], pos[2] + a[2]]);
  if (!p0 || !p1) return null;
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const len2 = dx*dx + dy*dy;
  if (len2 < 1e-6) return null;
  // p1 дальше p0 ровно на 1 мировую единицу оси → t в мировых единицах
  return ((mx - p0.x) * dx + (my - p0.y) * dy) / len2;
}
function sendMove(ref, x, z) {
  evalLisp("(begin (table-set! " + ref + " 'x " + x + ") (table-set! " + ref + " 'z " + z + "))");
}
function sendProp(ref, prop, val) {
  evalLisp("(table-set! " + ref + " '" + prop + " " + val + ")");
}

const cvsEl = $("gizmo");
cvsEl.addEventListener("mousedown", e => {
  if (!gizmoOn) return;
  const r = cvsEl.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const ax = hitHandle(mx, my);
  if (ax && selected && selected.ref) {
    drag = {
      axis: ax, ref: selected.ref,
      x0: selected.x || 0, z0: selected.z || 0, y0: selected.y,
      last: 0, mx, my
    };
    // якорь на момент старта тяги: экранная позиция сущности и направление
    // оси (px на мировую единицу) — иначе дельта дважды учитывает сдвиг
    if (ax !== "xz") {
      const pos = entPos(selected);
      const p0 = worldToScreen(pos);
      const a = AXIS[ax];
      const p1 = worldToScreen([pos[0] + a[0], pos[1] + a[1], pos[2] + a[2]]);
      if (p0 && p1) {
        drag.sx0 = p0.x; drag.sy0 = p0.y;
        drag.dx = p1.x - p0.x; drag.dy = p1.y - p0.y;
        drag.len2 = drag.dx * drag.dx + drag.dy * drag.dy;
      }
    }
    e.preventDefault();
  } else {
    // выбор сущности кликом по видовой порт — ближайшая проекция
    let best = null, bestD = 16;
    for (const en of scene) {
      const p = worldToScreen(entPos(en));
      if (!p) continue;
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < bestD) { bestD = d; best = en; }
    }
    if (best) {
      selKey = entKey(best);
      syncSelected();
      renderHier();
      renderInsp();
    }
  }
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const r = cvsEl.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  drag.mx = mx; drag.my = my;
  if (drag.axis === "xz") {
    const dir = pixelRay(mx, my);
    const w = dir && rayPlaneY(dir, drag.y0 !== undefined ? drag.y0 : GIZMO_Y);
    if (w && Date.now() - drag.last > 90) {
      drag.last = Date.now();
      sendMove(drag.ref, snap(w[0]), snap(w[2]));
    }
    return;
  }
  if (drag.axis === "y") {
    if (drag.y0 === undefined) {
      if (!drag.hinted) { drag.hinted = true; logLine("гизмо: у этой сущности нет свойства y — двигай по X/Z", "sys"); }
      return;
    }
    const d = axisDragDelta(drag, mx, my);
    if (d !== null && Date.now() - drag.last > 90) {
      drag.last = Date.now();
      sendProp(drag.ref, "y", snap(drag.y0 + d));
    }
    return;
  }
  const d = axisDragDelta(drag, mx, my);
  if (d !== null && Date.now() - drag.last > 90) {
    drag.last = Date.now();
    const nx = drag.axis === "x" ? snap(drag.x0 + d) : drag.x0;
    const nz = drag.axis === "z" ? snap(drag.z0 + d) : drag.z0;
    sendMove(drag.ref, nx, nz);
  }
});
// дельта вдоль оси от ЯКОРЯ старта тяги (экранная позиция на mousedown) —
// устойчива к тому, что сущность едет во время тяги
function axisDragDelta(d, mx, my) {
  if (d.len2 === undefined || d.len2 < 1e-6) return null;
  return ((mx - d.sx0) * d.dx + (my - d.sy0) * d.dy) / d.len2;
}
window.addEventListener("mouseup", () => {
  if (!drag) return;
  // финальный ход: фиксируем последнее положение мыши (тротлинг мог его съесть)
  const d = drag;
  drag = null;
  if (d.axis === "xz") {
    const dir = pixelRay(d.mx, d.my);
    const w = dir && rayPlaneY(dir, d.y0 !== undefined ? d.y0 : GIZMO_Y);
    if (w) sendMove(d.ref, snap(w[0]), snap(w[2]));
  } else if (d.axis === "y" && d.y0 !== undefined) {
    const dd = axisDragDelta(d, d.mx, d.my);
    if (dd !== null) sendProp(d.ref, "y", snap(d.y0 + dd));
  } else {
    const dd = axisDragDelta(d, d.mx, d.my);
    if (dd !== null) {
      const nx = d.axis === "x" ? snap(d.x0 + dd) : d.x0;
      const nz = d.axis === "z" ? snap(d.z0 + dd) : d.z0;
      sendMove(d.ref, nx, nz);
    }
  }
});

/* ───────────────────────── drag-n-drop префабов на видовой порт ───────────────────────── */
function renderPrefabs() {
  const box = $("prefabs");
  box.innerHTML = "";
  for (const p of prefabs) {
    const d = document.createElement("div");
    d.className = "prefab";
    d.draggable = true;
    d.innerHTML = "<span class='chip'>" + escapeHtml(p.kind) + "</span>" +
                  escapeHtml(p.name || p.kind) +
                  "<small>" + (p.hp ? "hp " + p.hp : "пропс") + " · spawn через (mcp-spawn-at)</small>";
    d.addEventListener("dragstart", ev => {
      ev.dataTransfer.setData("text/plain", p.kind);
      ev.dataTransfer.effectAllowed = "copy";
    });
    box.appendChild(d);
  }
  if (!prefabs.length) {
    box.innerHTML = "<div class='hint' style='padding:6px 10px;color:var(--dim);font-size:11.5px'>игра не объявила (prefab-list) — префабов нет</div>";
  }
}
const vp = $("viewport");
vp.addEventListener("dragover", e => { e.preventDefault(); vp.classList.add("dragover"); });
vp.addEventListener("dragleave", () => vp.classList.remove("dragover"));
vp.addEventListener("drop", e => {
  e.preventDefault();
  vp.classList.remove("dragover");
  const kind = e.dataTransfer.getData("text/plain");
  if (!kind) return;
  const r = $("gizmo").getBoundingClientRect();
  const dir = pixelRay(e.clientX - r.left, e.clientY - r.top);
  const w = dir && rayPlaneY(dir, GIZMO_Y);
  if (!w) { toast("позиция вне мира (луч мимо плоскости)", "err"); return; }
  const x = snap(w[0]), z = snap(w[2]);
  evalLisp("(mcp-spawn-at '" + kind + " " + x + " " + z + ")");
  toast("спавн: " + kind + " @ (" + x + ", " + z + ")");
});

/* ───────────────────────── сохранить сцену в Lisp-файл ───────────────────────── */
$("b-save-scene").onclick = async () => {
  const j = await api("/api/save-scene", {path: "scene_saved.lisp"});
  if (j.id) {
    waitResult(j.id, "сцена сохранена → assets/lisp/scene_saved.lisp");
  } else {
    toast("ошибка сохранения сцены: " + (j.error || "?"), "err");
  }
};
let pendingToasts = {};
function waitResult(id, okText) {
  pendingToasts[id] = okText;
}

/* ───────────────────────── иерархия ───────────────────────── */
function entKey(e) { return (e.type || "?") + ":" + (e.id != null ? e.id : "-"); }
let selKey = null, lastSig = null;
function sceneSig() { return scene.map(entKey).join("|"); }
function syncSelected() { selected = scene.find(e => entKey(e) === selKey) || selected; }

function renderHier() {
  const h = $("hier");
  const sig = sceneSig();
  if (sig !== lastSig) {
    lastSig = sig;
    h.innerHTML = "";
    const groups = {};
    for (const e of scene) (groups[e.type] = groups[e.type] || []).push(e);
    for (const type of Object.keys(groups).sort()) {
      const g = document.createElement("div");
      g.className = "grp"; g.textContent = type + "  ·  " + groups[type].length;
      h.appendChild(g);
      for (const e of groups[type]) {
        const d = document.createElement("div");
        d.className = "ent";
        d.dataset.key = entKey(e);
        const name = document.createElement("span");
        name.textContent = e.name ? e.name : e.type + " #" + e.id;
        const co = document.createElement("span");
        co.className = "co";
        d.appendChild(name);
        d.appendChild(co);
        d.onclick = () => { selKey = entKey(e); syncSelected(); renderHier(); renderInsp(); };
        h.appendChild(d);
      }
    }
  }
  for (const d of h.querySelectorAll(".ent")) {
    const e = scene.find(x => entKey(x) === d.dataset.key);
    if (!e) continue;
    const co = e.x !== undefined ? " (" + fmt(e.x) + ", " + fmt(e.z !== undefined ? e.z : e.y) + ")" : "";
    d.querySelector(".co").textContent = co;
    d.classList.toggle("sel", selKey === d.dataset.key);
  }
}

/* ───────────────────────── инспектор ───────────────────────── */
function renderInspSoft() {
  if (!selected) return;
  document.querySelectorAll("#insp input[data-prop]").forEach(inp => {
    if (inp === document.activeElement) return; // не бьём по рукам во время правки
    const v = selected[inp.dataset.prop];
    if (v !== undefined && String(v) !== inp.value) inp.value = v;
  });
}
function renderInsp() {
  const box = $("insp");
  if (!selected) {
    box.innerHTML = "<div class='hint'>Выбери сущность в иерархии<br>или кликни по виду.<br><br>" +
      "<span class='kbd'>G</span> — гизмо, <span class='kbd'>Del</span> — удалить выбранное.</div>";
    return;
  }
  const skip = new Set(["id", "type", "ref", "name", "__i"]);
  let html = "<div class='name'>" + escapeHtml(selected.name || selected.type) + " #" + selected.id + "</div>";
  html += "<div class='hint' style='padding:0 0 6px'>ref: <code>" + escapeHtml(selected.ref || "?") + "</code></div>";
  for (const k of Object.keys(selected)) {
    if (skip.has(k)) continue;
    const v = selected[k];
    if (typeof v === "number" || typeof v === "string" || typeof v === "boolean") {
      html += "<div class='prop'><label>" + escapeHtml(k) + "</label>" +
              "<input data-prop='" + escapeHtml(k) + "' value='" + escapeHtml(fmt(v)) + "'></div>";
    }
  }
  html += "<button class='apply primary' onclick='applyInsp()'>Применить</button>";
  html += (selected.type === "enemy" || selected.type === "pylon")
        ? "<button class='apply del' onclick='removeSel()'>Удалить</button>" : "";
  box.innerHTML = html;
}
function applyInsp() {
  if (!selected || !selected.ref) return;
  const sets = [];
  document.querySelectorAll("#insp input[data-prop]").forEach(inp => {
    const k = inp.dataset.prop, raw = inp.value.trim();
    let v;
    if (raw === "#t") v = "#t";
    else if (raw === "#f") v = "#f";
    else if (!isNaN(parseFloat(raw)) && /^-?[\d.]+(e-?\d+)?$/i.test(raw)) v = raw;
    else v = "'" + raw;
    sets.push("(table-set! " + selected.ref + " '" + k + " " + v + ")");
  });
  if (sets.length) evalLisp("(begin " + sets.join(" ") + ")");
}
function removeSel() {
  if (selected && (selected.type === "enemy" || selected.type === "pylon") && selected.id != null) {
    evalLisp("(mcp-remove " + selected.id + ")");
    logLine("удалена сущность #" + selected.id, "sys");
  }
  selected = null; selKey = null; renderInsp();
}
window.applyInsp = applyInsp;
window.removeSel = removeSel;

/* ───────────────────────── код и ассеты ───────────────────────── */
function renderAssets() {
  const box = $("assets");
  box.innerHTML = "";
  for (const a of assets) {
    const b = document.createElement("button");
    b.textContent = a.split("/").pop();
    b.onclick = () => openFile(a);
    if (curFile === a) b.style.borderColor = "var(--acc)";
    box.appendChild(b);
  }
}
async function openFile(p) {
  const j = await api("/api/file?path=" + encodeURIComponent(p));
  if (j.content !== undefined) {
    $("code").value = j.content;
    curFile = p;
    $("codefile").textContent = p;
    document.querySelector('[data-t="code"]').click();
  } else logLine("файл: " + (j.error || "?"), "bad");
}
async function saveCode() {
  if (!curFile) return;
  await api("/api/save", {path: curFile, content: $("code").value});
  logLine("сохранено: " + curFile + " — движок подхватит на лету", "sys");
}
$("b-save").onclick = saveCode;
$("code").addEventListener("input", () => {
  $("codefile").textContent = curFile + " • изменён";
});

/* ───────────────────────── REPL ───────────────────────── */
$("repl-in").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const inp = e.target;
  const code = inp.value.trim();
  if (!code) return;
  logLine("› " + code, "usr");
  inp.value = "";
  evalLisp(code);
});
document.querySelector('[data-t="console"]').addEventListener("click", () => {
  setTimeout(() => $("repl-in").focus(), 0);
});

/* ───────────────────────── тулбар ───────────────────────── */
$("b-pause").onclick = () => api("/api/ctl", {cmd: "pause"});
$("b-step").onclick = () => api("/api/ctl", {cmd: "step"});
$("b-reload").onclick = () => api("/api/ctl", {cmd: "reload"});
$("b-gizmo").onclick = () => { gizmoOn = !gizmoOn; $("b-gizmo").classList.toggle("on", gizmoOn); };
$("b-snap").onclick = () => { snapOn = !snapOn; $("b-snap").classList.toggle("on", snapOn); };

document.addEventListener("keydown", e => {
  const inField = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveCode(); return; }
  if (inField) return;
  if (e.key === "g" || e.key === "G" || e.key === "п" || e.key === "П") {
    $("b-gizmo").click();
  } else if (e.key === "Delete" || e.key === "Backspace") {
    if (selected) { removeSel(); e.preventDefault(); }
  }
});

/* ───────────────────────── табы ───────────────────────── */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".tabpage").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  $("p-" + t.dataset.t).classList.add("on");
});

/* ───────────────────────── цикл опроса ───────────────────────── */
let frameTick = 0;
async function poll() {
  try {
    const st = await api("/api/state?since=" + lastResult);
    $("s-frame").textContent = st.frame;
    $("s-fps").textContent = Math.round(st.fps);
    $("s-dc").textContent = st.drawcalls;
    $("paused-tag").style.display = st.paused ? "block" : "none";
    $("b-pause").textContent = st.paused ? "▶ Пуск" : "⏸ Пауза";

    // камера и префабы (этап 6): игра отдаёт хуки (editor-camera)/(prefab-list)
    if (st.camera && st.camera !== "null") {
      try { cam = JSON.parse(st.camera); rebuildMvp(); } catch (_) {}
    }
    if (st.prefabs && st.prefabs !== "null") {
      try {
        const p = JSON.parse(st.prefabs);
        if (JSON.stringify(p) !== JSON.stringify(prefabs)) { prefabs = p; renderPrefabs(); }
      } catch (_) {}
    }

    if (st.scene && st.scene !== "[]") {
      try {
        scene = JSON.parse(st.scene);
        renderHier();
        if (selKey) {
          // сущность умерла в игре — честно снимаем выбор
          if (!scene.find(e => entKey(e) === selKey)) {
            selected = null; selKey = null; renderInsp();
          } else {
            syncSelected();
            renderInspSoft();
          }
        }
        drawGizmo();
      } catch (_) {}
    } else {
      drawGizmo();
    }

    for (const l of st.log || []) {
      if (l[0] > lastLogSeq) { lastLogSeq = l[0]; logLine(l[1], "sys"); }
    }
    for (const r of st.results || []) {
      logLine("#" + r.id + " → " + r.result, r.result.startsWith("ОШИБКА") ? "bad" : "res");
      if (r.id > lastResult) lastResult = r.id;
      if (pendingToasts[r.id]) {
        toast(pendingToasts[r.id] + " · " + r.result, r.result.startsWith("ОШИБКА") ? "err" : "");
        delete pendingToasts[r.id];
      }
    }
    const newAssets = (st.assets || []).join("\u0000");
    if (newAssets !== assets.join("\u0000")) { assets = st.assets || []; renderAssets(); }

    frameTick++;
    if (frameTick % 2 === 0) $("view").src = "/frame.png?t=" + Date.now();
  } catch (_) { /* сервер мог быть перезапущен */ }
}
setInterval(poll, 250);
poll();
logLine("редактор подключён. Всё живое: правь код — мир меняется без перезапуска.", "sys");
</script>
</body>
</html>
